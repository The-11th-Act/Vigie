services:
  db:
    image: postgres:15-alpine
    container_name: tvm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvm_password}
      POSTGRES_DB: ${POSTGRES_DB:-tvm_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tvm_user} -d ${POSTGRES_DB:-tvm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tvm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: tvm_migrate
    command: alembic upgrade head
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - see .env.example}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tvm_user}:${POSTGRES_PASSWORD:-tvm_password}@db:5432/${POSTGRES_DB:-tvm_platform}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: tvm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      # Shared with the worker: the API stages the upload here and only hands
      # the path to Celery, so both containers must see the same directory.
      - scan_uploads:/var/lib/vigie/scans
    ports:
      - "8000:8000"
    environment:
      # SECRET_KEY has no default on purpose: compose fails fast if .env is
      # missing rather than silently booting with a publicly known key.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - see .env.example}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tvm_user}:${POSTGRES_PASSWORD:-tvm_password}@db:5432/${POSTGRES_DB:-tvm_platform}
      - REDIS_URL=redis://redis:6379/0
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://frontend:5173"]
      # Optional: auto-creates (or promotes) the first admin account on
      # startup when all three are set. Leave unset to skip bootstrap.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    container_name: tvm_celery_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - scan_uploads:/var/lib/vigie/scans
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - see .env.example}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tvm_user}:${POSTGRES_PASSWORD:-tvm_password}@db:5432/${POSTGRES_DB:-tvm_platform}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: tvm_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://web:8000
    depends_on:
      - web

volumes:
  pgdata:
  scan_uploads:
