version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tvm_db
    environment:
      POSTGRES_USER: tvm_user
      POSTGRES_PASSWORD: tvm_password
      POSTGRES_DB: tvm_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvm_user -d tvm_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tvm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tvm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tvm_user:tvm_password@db:5432/tvm_platform
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkeychangeitinproduction1234567890
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://frontend:5173"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: tvm_celery_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://tvm_user:tvm_password@db:5432/tvm_platform
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkeychangeitinproduction1234567890
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tvm_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://web:8000
    depends_on:
      - web

volumes:
  pgdata: