# Application settings shared by the API, the worker and the scheduler.
#
# Containers never read .env themselves: it is kept out of the image, and the
# production overlay mounts no source tree. A setting reaches the application
# only if it is listed here (or on a service) and interpolated from the host's
# .env by compose. An unset variable arrives empty, and the application then
# ignores it and keeps its own default (env_ignore_empty in app/core/config.py),
# so defaults live in one place: the code.
#
# tests/test_deployment_config.py fails when a setting added to the code is not
# wired here, which is how CRITICALITY_RULES and the threat-intel settings went
# unnoticed: in development, the bind-mounted .env hid the gap.
x-app-settings: &app-settings
  LOG_LEVEL: ${LOG_LEVEL:-}
  LOG_FORMAT: ${LOG_FORMAT:-}
  SECRET_KEY_ID: ${SECRET_KEY_ID:-}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-}
  MAX_SCAN_UPLOAD_BYTES: ${MAX_SCAN_UPLOAD_BYTES:-}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-}
  CRITICALITY_RULES: ${CRITICALITY_RULES:-}
  INTERNET_FACING_SUBNETS: ${INTERNET_FACING_SUBNETS:-}
  OWNER_TEAM_RULES: ${OWNER_TEAM_RULES:-}
  ENVIRONMENT_RULES: ${ENVIRONMENT_RULES:-}
  AUTO_REMEDIATE_AFTER_MISSES: ${AUTO_REMEDIATE_AFTER_MISSES:-}
  RESCORE_HOUR_UTC: ${RESCORE_HOUR_UTC:-}
  RISK_ACCEPTANCE_DEFAULT_DAYS: ${RISK_ACCEPTANCE_DEFAULT_DAYS:-}
  RISK_ACCEPTANCE_MAX_DAYS: ${RISK_ACCEPTANCE_MAX_DAYS:-}
  KEV_SLA_DAYS: ${KEV_SLA_DAYS:-}
  RANSOMWARE_SLA_DAYS: ${RANSOMWARE_SLA_DAYS:-}
  SLA_CRITICAL_DAYS: ${SLA_CRITICAL_DAYS:-}
  SLA_HIGH_DAYS: ${SLA_HIGH_DAYS:-}
  SLA_MEDIUM_DAYS: ${SLA_MEDIUM_DAYS:-}
  SLA_LOW_DAYS: ${SLA_LOW_DAYS:-}
  SLA_DEFAULT_DAYS: ${SLA_DEFAULT_DAYS:-}
  THREAT_INTEL_ENABLED: ${THREAT_INTEL_ENABLED:-}
  THREAT_INTEL_KEV_URL: ${THREAT_INTEL_KEV_URL:-}
  THREAT_INTEL_EPSS_URL: ${THREAT_INTEL_EPSS_URL:-}
  THREAT_INTEL_REFRESH_HOUR_UTC: ${THREAT_INTEL_REFRESH_HOUR_UTC:-}
  THREAT_INTEL_TIMEOUT_SECONDS: ${THREAT_INTEL_TIMEOUT_SECONDS:-}
  THREAT_INTEL_MAX_FEED_BYTES: ${THREAT_INTEL_MAX_FEED_BYTES:-}
  THREAT_INTEL_STALE_AFTER_HOURS: ${THREAT_INTEL_STALE_AFTER_HOURS:-}
  WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-}
  WEBHOOK_DELIVERY_INTERVAL_SECONDS: ${WEBHOOK_DELIVERY_INTERVAL_SECONDS:-}
  WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-}
  WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-}
  WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-}
  WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-}
  CROWDSTRIKE_BASE_URL: ${CROWDSTRIKE_BASE_URL:-}
  CROWDSTRIKE_SYNC_ENABLED: ${CROWDSTRIKE_SYNC_ENABLED:-}
  CROWDSTRIKE_SYNC_INTERVAL_MINUTES: ${CROWDSTRIKE_SYNC_INTERVAL_MINUTES:-}
  # Outbound access for the KEV / EPSS / CrowdStrike clients and the webhooks
  # (read by requests).
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}

# One image for the API, the migrations, the worker and the scheduler, named
# after the release it was built from. Staging builds VIGIE_VERSION once and
# production runs that same image (--no-build), rather than rebuilding it from
# its own checkout: docs/PREPRODUCTION.md. VIGIE_REGISTRY ("registry.example.com/
# vigie/") names a registry to push to and pull from when they are two hosts.
#
# No container_name anywhere: containers, network and volumes are all named
# after the compose project, so a staging and a production stack can share a
# host without sharing anything.
x-api-image: &api-image ${VIGIE_REGISTRY:-}vigie-api:${VIGIE_VERSION:-latest}

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigie_password}
      POSTGRES_DB: ${POSTGRES_DB:-vigie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigie_user} -d ${POSTGRES_DB:-vigie}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: *api-image
    command: alembic upgrade head
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vigie_user}:${POSTGRES_PASSWORD:-vigie_password}@db:5432/${POSTGRES_DB:-vigie}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    image: *api-image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      # Shared with the worker: the API stages the upload here and only hands
      # the path to Celery, so both containers must see the same directory.
      - scan_uploads:/var/lib/vigie/scans
    ports:
      - "8000:8000"
    environment:
      <<: *app-settings
      # SECRET_KEY has no default on purpose: the application refuses to start
      # without one (from .env here, from a Docker secret in production) rather
      # than boot with a publicly known key.
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vigie_user}:${POSTGRES_PASSWORD:-vigie_password}@db:5432/${POSTGRES_DB:-vigie}
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:5173"]'
      # Retired signing keys, still accepted to verify their tokens. Secret,
      # and only the API verifies tokens.
      PREVIOUS_SECRET_KEYS: ${PREVIOUS_SECRET_KEYS:-}
      # Requests served at once by each API process (docs/EXPLOITATION.md).
      API_THREADS: ${API_THREADS:-}
      # "Preproduction" on a staging stack: shown on every screen.
      INSTANCE_BANNER: ${INSTANCE_BANNER:-}
      # Login throttling only concerns the API.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-}
      # Optional: auto-creates (or promotes) the first admin account on
      # startup when all three are set. Leave unset to skip bootstrap.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    image: *api-image
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - scan_uploads:/var/lib/vigie/scans
    environment:
      <<: *app-settings
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vigie_user}:${POSTGRES_PASSWORD:-vigie_password}@db:5432/${POSTGRES_DB:-vigie}
      REDIS_URL: redis://redis:6379/0
      # Credentials only where the Spotlight client runs.
      CROWDSTRIKE_CLIENT_ID: ${CROWDSTRIKE_CLIENT_ID:-}
      CROWDSTRIKE_CLIENT_SECRET: ${CROWDSTRIKE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scheduler for the daily rescoring of the open backlog, and for the
  # periodic CrowdStrike pull when that sync is enabled.
  beat:
    build: .
    image: *api-image
    command: celery -A app.worker.celery_app beat --loglevel=info
    # The image's HEALTHCHECK probes the API on :8000, which a scheduler does
    # not serve: the container was always reported unhealthy. beat runs as the
    # container's main process, so it being alive is the container being up.
    healthcheck:
      disable: true
    volumes:
      - .:/app
    environment:
      # The schedule itself is built from these settings (which jobs, at what
      # hour), so the scheduler needs them as much as the worker does.
      <<: *app-settings
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vigie_user}:${POSTGRES_PASSWORD:-vigie_password}@db:5432/${POSTGRES_DB:-vigie}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: vigie-frontend-dev:${VIGIE_VERSION:-latest}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://web:8000
    depends_on:
      - web

volumes:
  pgdata:
  scan_uploads:
