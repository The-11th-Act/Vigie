# Surcouche de production.
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ce fichier corrige le point D1 de l'audit : docker-compose.yml seul est un
# environnement de developpement (--reload, code monte en volume, frontend en
# npm run dev, bases exposees sur l'hote). Rien de tout cela ne doit tourner
# en production.
#
# Les secrets (cle de signature, mots de passe PostgreSQL et Redis) sont des
# fichiers, montes en Docker secrets dans /run/secrets : ils n'apparaissent ni
# dans le .env ni dans l'environnement des conteneurs (docker inspect). Un
# fichier manquant fait echouer le demarrage : jamais de repli sur un mot de
# passe connu de tous. Mise en place : README, "Running in production".
#
# Le reste de la configuration vient du .env, sans repli pour ce qui doit
# etre choisi (utilisateur et base PostgreSQL, origines CORS).
#
# La preproduction utilise ce meme fichier, sans surcouche propre : un second
# checkout avec son .env (COMPOSE_PROJECT_NAME, FRONTEND_PORT) et ses secrets.
# Les images portent VIGIE_VERSION : la production execute celles que la
# preproduction a construites et validees. docs/PREPRODUCTION.md.

secrets:
  # Repertoire en 0700 appartenant a root sur l'hote ; fichiers en 0444 pour
  # que chaque conteneur (postgres, appuser, sauvegarde) puisse les lire une
  # fois montes, sans que personne d'autre sur l'hote n'y accede.
  secret_key:
    file: ${VIGIE_SECRETS_DIR:-./secrets}/secret_key
  postgres_password:
    file: ${VIGIE_SECRETS_DIR:-./secrets}/postgres_password
  redis_password:
    file: ${VIGIE_SECRETS_DIR:-./secrets}/redis_password
  # Cles retirees encore acceptees pendant une rotation, en JSON ({} hors
  # rotation). Seule l'API verifie les tokens. docs/EXPLOITATION.md.
  previous_secret_keys:
    file: ${VIGIE_SECRETS_DIR:-./secrets}/previous_secret_keys

services:
  db:
    # `ports` n'est pas surchargeable en retrait par une surcouche : la
    # publication de 5432 definie dans le fichier de base est neutralisee en
    # liant explicitement a la boucle locale. La base ne doit etre joignable
    # que par les autres conteneurs.
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      # L'image refuse POSTGRES_PASSWORD et POSTGRES_PASSWORD_FILE ensemble :
      # la valeur de developpement du fichier de base est retiree.
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    secrets: [postgres_password]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    ports: !override []
    # Un Redis sans mot de passe accessible depuis le reseau, c'est une
    # execution de commandes a distance offerte (CONFIG SET dir/dbfilename).
    # Le mot de passe est lu dans le secret au demarrage. Relance par le
    # script d'entree de l'image, qui abandonne root pour l'utilisateur
    # redis : un `sh -c` seul ferait tourner Redis en root.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server
        --requirepass "$$(cat /run/secrets/redis_password)"
        --maxmemory 512mb
        --maxmemory-policy noeviction
    secrets: [redis_password]
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  migrate:
    environment:
      - ENVIRONMENT=production
      # Secrets lus dans /run/secrets (convention *_FILE), jamais dans
      # l'environnement : `docker inspect` ne les montre pas. SECRET_KEY vide :
      # une ancienne valeur restee dans le .env ne l'emporte pas sur le secret.
      - SECRET_KEY=
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - DATABASE_URL=postgresql://${POSTGRES_USER}@db:5432/${POSTGRES_DB}
    secrets: [secret_key, postgres_password]
    restart: "no"

  web:
    # Pas de --reload : le rechargeur surveille le systeme de fichiers, ne
    # sert qu'un process, et recharge du code arbitraire s'il change.
    # --workers exploite les coeurs disponibles ; l'application etant
    # synchrone cote base, la concurrence vient des process, pas de l'async.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-4}
      --proxy-headers --forwarded-allow-ips=*
      --no-server-header
    # Aucun bind mount : le conteneur execute l'image construite, pas le
    # repertoire de travail de l'hote. Sans cela, l'image n'est jamais testee
    # et le USER appuser du Dockerfile ne protege rien. Seul reste le volume
    # d'uploads partage avec le worker : l'API y depose le scan et ne transmet
    # que son chemin a Celery.
    volumes: !override
      - scan_uploads:/var/lib/vigie/scans
    # L'API n'est joignable que par le frontend Nginx, sur le reseau interne.
    ports: !override []
    environment:
      - ENVIRONMENT=production
      # Secrets lus dans /run/secrets (convention *_FILE), jamais dans
      # l'environnement : `docker inspect` ne les montre pas. SECRET_KEY vide :
      # une ancienne valeur restee dans le .env ne l'emporte pas sur le secret.
      - SECRET_KEY=
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - DATABASE_URL=postgresql://${POSTGRES_USER}@db:5432/${POSTGRES_DB}
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_URL=redis://redis:6379/0
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required, e.g. ["https://vigie.example.com"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Volontairement absents : le bootstrap admin est une operation
      # ponctuelle, pas une variable permanente d'un service de production.
      # Le lancer explicitement une fois, puis gerer les roles via l'API.
      - ADMIN_USERNAME=
      - ADMIN_EMAIL=
      - ADMIN_PASSWORD=
      - PREVIOUS_SECRET_KEYS=
      - PREVIOUS_SECRET_KEYS_FILE=/run/secrets/previous_secret_keys
    secrets: [secret_key, previous_secret_keys, postgres_password, redis_password]
    healthcheck:
      # /ready et non /health : inclut Redis et la presence d'un worker
      # Celery, donc un noeud incapable d'ingerer un scan est retire du
      # service.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

  worker:
    # --max-tasks-per-child borne les fuites memoire d'un parseur XML sur un
    # gros scan : le process enfant est recycle plutot que de grossir.
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=${LOG_LEVEL:-INFO}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=100
      --max-memory-per-child=512000
    volumes: !override
      - scan_uploads:/var/lib/vigie/scans
    environment:
      - ENVIRONMENT=production
      # Secrets lus dans /run/secrets (convention *_FILE), jamais dans
      # l'environnement : `docker inspect` ne les montre pas. SECRET_KEY vide :
      # une ancienne valeur restee dans le .env ne l'emporte pas sur le secret.
      - SECRET_KEY=
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - DATABASE_URL=postgresql://${POSTGRES_USER}@db:5432/${POSTGRES_DB}
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets: [secret_key, postgres_password, redis_password]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

  beat:
    # Planificateur du recalcul quotidien des scores et de la synchro
    # CrowdStrike. Un seul exemplaire : deux beat programmeraient chaque tache
    # deux fois.
    volumes: !override []
    environment:
      - ENVIRONMENT=production
      # Secrets lus dans /run/secrets (convention *_FILE), jamais dans
      # l'environnement : `docker inspect` ne les montre pas. SECRET_KEY vide :
      # une ancienne valeur restee dans le .env ne l'emporte pas sur le secret.
      - SECRET_KEY=
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - DATABASE_URL=postgresql://${POSTGRES_USER}@db:5432/${POSTGRES_DB}
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets: [secret_key, postgres_password, redis_password]
    restart: unless-stopped
    read_only: true
    tmpfs:
      # celery beat ecrit son etat (celerybeat-schedule) dans le repertoire
      # courant par defaut ; le systeme de fichiers etant en lecture seule, on
      # le redirige vers un tmpfs.
      - /tmp
    command: >
      celery -A app.worker.celery_app beat
      --loglevel=${LOG_LEVEL:-INFO}
      --schedule=/tmp/celerybeat-schedule
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: ${VIGIE_REGISTRY:-}vigie-frontend:${VIGIE_VERSION:-latest}
    # Le SPA construit et servi par Nginx, qui fait aussi office de reverse
    # proxy vers l'API (cf. frontend/nginx.conf).
    volumes: !override []
    ports: !override
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    environment: !override {}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # Nginx tourne en utilisateur nginx (uid 101 dans l'image officielle) et
      # doit creer ses repertoires temporaires ici. Un tmpfs appartient a root
      # par defaut : sans uid/gid, Nginx echouait au demarrage (mkdir
      # client_temp: Permission denied) et redemarrait en boucle.
      - /var/cache/nginx:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  backup:
    # Sauvegarde chiffree de la base (point D8) : une au demarrage, puis toutes
    # les BACKUP_INTERVAL_HOURS heures, avec retention. Procedure de
    # restauration : docs/SAUVEGARDE.md. Une sauvegarde qui reste sur le meme
    # disque que la base n'en est pas une : BACKUP_VOLUME peut designer un
    # chemin monte depuis un autre stockage.
    build:
      context: ./deploy/backup
    image: ${VIGIE_REGISTRY:-}vigie-backup:${VIGIE_VERSION:-latest}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Cle publique age : le serveur chiffre, seule la cle privee, gardee
      # hors de la plateforme, dechiffre.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-false}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets: [postgres_password]
    volumes:
      - ${BACKUP_VOLUME:-backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  backups:
