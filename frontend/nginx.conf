# Configuration Nginx du frontend Vigie en production.
#
# Ce fichier resout le point D4 de l'audit : en production, le SPA appelle
# /api/v1 en relatif sur son propre domaine. Sans ce reverse proxy, aucune de
# ces requetes n'atteint l'API. `VITE_API_TARGET` ne servait qu'au proxy du
# serveur de developpement Vite, qui n'existe pas en production.

upstream vigie_api {
    server web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de Nginx.
    server_tokens off;

    # En-tetes de securite. La plateforme manipule des donnees de
    # vulnerabilites : une injection de contenu y est particulierement couteuse.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' sur style-src est requis par les styles injectes par
    # Recharts. A retirer si le graphe passe a des classes statiques.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    client_max_body_size 64m;  # doit rester >= MAX_SCAN_UPLOAD_BYTES (50 Mo)

    # Sonde du conteneur frontend lui-meme, sans dependre de l'API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Les assets construits par Vite portent un hash dans leur nom : ils sont
    # immuables et peuvent etre caches indefiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://vigie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propage l'identifiant de correlation vers l'API.
        proxy_set_header X-Request-ID $request_id;

        # Un scan de 50 Mo doit pouvoir monter sans etre bufferise sur disque
        # ni couper avant la fin de l'ingestion cote API.
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Routes cote client (React Router) : tout chemin inconnu doit rendre
    # index.html, sinon un rechargement sur /login renvoie un 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit jamais etre mis en cache, sinon le navigateur
        # continue de referencer des assets hashes qui n'existent plus.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
