# En-tetes de securite, inclus par nginx.conf au niveau du serveur ET dans
# chaque location qui pose son propre add_header : Nginx n'herite pas des
# add_header du niveau superieur des qu'un bloc en declare un. Sans cette
# inclusion, index.html partait sans aucun de ces en-tetes (audit du 09/10/2026).
#
# La plateforme manipule des donnees de vulnerabilites : une injection de
# contenu y est particulierement couteuse.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# 'unsafe-inline' sur style-src est requis par les styles injectes par
# Recharts. A retirer si le graphe passe a des classes statiques.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
