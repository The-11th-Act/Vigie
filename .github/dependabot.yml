# Mises a jour de dependances proposees chaque semaine, regroupees pour ne pas
# noyer le depot de PR : une par ecosysteme pour les mineures et correctifs,
# une par dependance pour les majeures (qui meritent une lecture). La CI, dont
# la pile de production de bout en bout, valide chacune avant fusion.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Images de base, y compris leurs digests une fois epinglees. L'image de la
  # base (docker-compose.yml) et celle de la sauvegarde doivent rester
  # identiques : un test le verifie.
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /deploy/backup
    schedule:
      interval: weekly
    ignore:
      # Une majeure de PostgreSQL ne demarre pas sur les donnees de la
      # precedente : elle demande pg_upgrade ou une sauvegarde/restauration, et
      # la meme version pour la base et la sauvegarde. C'est une operation
      # planifiee, pas une PR de routine.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Changer de version de Python impose de regenerer le lockfile pour elle.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Une majeure de PostgreSQL ne demarre pas sur les donnees de la
      # precedente : elle demande pg_upgrade ou une sauvegarde/restauration, et
      # la meme version pour la base et la sauvegarde. C'est une operation
      # planifiee, pas une PR de routine.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Changer de version de Python impose de regenerer le lockfile pour elle.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
