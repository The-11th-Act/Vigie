name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Migrations apply and roll back cleanly
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f ci.db

      - name: Tests
        env:
          # The suite builds its own SQLite database; these only satisfy the
          # settings validation performed at import time.
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
          ENVIRONMENT: development
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, so CI tests exactly the versions
      # the lockfile pins.
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t vigie-api:ci .
      - name: Build frontend image
        run: docker build -t vigie-frontend:ci ./frontend
